
[app]
vacuum_channels_every = "30 minutes"
channels_expire_after = "24 hours"
max_buffer_size = 5000
message_ttl = "24 hours"

[block_store]
path = "/var/lib/recent-messages/cache.sqlite"
block_messages = 100
max_messages_per_channel = 5000
writer_queue_batches = 256
read_connections = 4

[control_store]
path = "/var/lib/recent-messages/control.sqlite"

[ingest]
enabled = true
raw_firehoses = [
  "wss://logs.spanix.team/firehose",
  "wss://logs.supa.codes/firehose",
  "wss://logs.susgee.dev/firehose",
  "wss://logxx.dev/firehose",
]
origin = "https://tv.supa.sh"
batch_messages = 100
batch_max_delay = "100ms"
reconnect_min_delay = "1s"
reconnect_max_delay = "30s"
queue_batches = 256
max_open_channels = 50000
max_open_bytes = 268435456
idle_seal_after = "5 minutes"
max_open_age = "10 minutes"
seal_interval = "1s"
checkpoint_interval = "10 minutes"
checkpoint_poll_interval = "30s"
checkpoint_journal_bytes = 268435456

[storage_budget]
max_bytes = 8589934592
max_filesystem_percent = 75
min_free_bytes = 2147483648
wal_reserve_bytes = 1073741824
high_water_ratio = 0.90
target_ratio = 0.80
emergency_ratio = 0.98
pressure_floor_messages_per_channel = 800
max_enforcement_passes = 8

[irc]
always_join_channels = []
new_connection_every = "550ms"
join_confirmation_timeout = "30s"
join_retry_poll = "30s"
join_retry_min = "1 minute"
join_retry_max = "6 hours"
unavailable_retry_after = "6 hours"

[admin]
max_always_join_channels = 100000

[health]
firehose_max_event_age = "5 minutes"
ingest_max_accept_age = "2 minutes"
max_queue_batches = 200

[peer]
nodes = []
connect_timeout = "1s"
request_timeout = "3s"
delegate_timeout = "5s"
max_inflight = 32
refresh_after = "24 hours"

[repair]
connect_timeout = "1 second"
request_timeout = "5 seconds"
fast_return_wait = "350ms"
foreground_wait = "500ms"
max_inflight = 16
max_response_bytes = 4194304
failure_threshold = 5
open_duration = "30s"
refresh_after = "6 hours"
partial_retry_after = "5 minutes"
failure_retry_after = "1 minute"
handoff_grace = "5s"

[[repair.providers]]
name = "robotty"
base_url = "https://recent-messages.robotty.de/api/v2/recent-messages/"

[[repair.providers]]
name = "zneix"
base_url = "https://recent-messages.zneix.eu/api/v2/recent-messages/"

[[repair.providers]]
name = "lilb"
base_url = "https://rm.lilb.dev/api/v2/recent-messages/"

[web]
listen_address = { type = "tcp", address = "127.0.0.1:2790" }
client_id = "REPLACE_WITH_TWITCH_CLIENT_ID"
client_secret = "REPLACE_WITH_TWITCH_CLIENT_SECRET"
redirect_uri = "https://rm.iore.tv/authorized"
sessions_expire_after = "7 days"
recheck_twitch_auth_after = "1 hour"
request_timeout = "10 seconds"
max_inflight_recent_requests = 0
adaptive_response_cache_enabled = true
adaptive_response_cache_max_age = "1 second"
adaptive_response_cache_pressure_hold = "2 seconds"
adaptive_response_cache_enter_inflight = 8
adaptive_response_cache_max_entries = 256
adaptive_response_cache_max_bytes = 16777216
adaptive_response_cache_max_entry_bytes = 1048576

[control_sync]
role = "off"
authority_url = ""
peer_url = ""
replica_urls = []
request_timeout = "3s"
sync_interval = "5s"

[cache_placement]
local_node = ""
members = []
copies = 1
